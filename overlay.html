<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SnapNote Overlay</title>
    <link rel="stylesheet" href="/src/annotator.css" />
    <link rel="stylesheet" href="/src/overlay.css" />
  </head>
  <body>
    <canvas id="bg"></canvas>
    <div id="dim"></div>
    <div id="sel" hidden><span id="size"></span></div>
    <div id="stage-host" hidden><div id="stage"></div></div>
    <div id="toolbar" class="bar" hidden></div>
    <div id="toast" hidden></div>
    <div id="modebar" class="bar" hidden>
      <button id="mode-shot" class="active" title="Chụp màn hình (đang chọn)">
        <svg viewBox="0 0 24 24"><path d="M4 8V5a1 1 0 0 1 1-1h3M16 4h3a1 1 0 0 1 1 1v3M20 16v3a1 1 0 0 1-1 1h-3M8 20H5a1 1 0 0 1-1-1v-3"/><circle cx="12" cy="12" r="2.5"/></svg>
        Chụp màn hình
      </button>
      <button id="mode-rec" title="Chuyển sang ghi âm (R)">
        <svg viewBox="0 0 24 24"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/></svg>
        <span id="mode-rec-label">Ghi âm</span>
      </button>
      <span class="sep"></span>
      <button id="mode-close" title="Đóng (Esc)"><svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
    </div>
    <div id="hint">Kéo chuột để chọn vùng · Enter: toàn màn hình · Esc / chuột phải: hủy</div>
    <script type="module" src="/src/overlay.js"></script>
  </body>
</html>
