<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <title>SnapNote REC</title>
    <link rel="stylesheet" href="/src/pill.css" />
  </head>
  <body>
    <div id="pill">
      <i class="dot" id="dot"></i>
      <span id="time">00:00</span>
      <button id="toggle" title="Tạm dừng"></button>
      <button id="stop" class="stop" title="Dừng và lưu file ghi âm">
        <svg viewBox="0 0 24 24"><rect x="6" y="6" width="12" height="12" rx="2" fill="currentColor" stroke="none"/></svg>
        Dừng
      </button>
    </div>
    <script type="module" src="/src/pill.js"></script>
  </body>
</html>
